name: xiaoping-codex
docker:
  image: ghcr.io/xiaopingarchive/mecha-worker-codex:xp-remote-worker-v1
  credentials_rw: [codex]
  resources:
    cpu: 2
    memory: 2200M
    pids: 256
  lifecycle: disposable
  env:
    CODEX_SANDBOX: read-only
    CODEX_WEB_SEARCH: live
    CODEX_TIMEOUT_MS: "1500000"
timeout: 27m
